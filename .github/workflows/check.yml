name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run format:check
      - run: python3 tools/verify_export_evidence.py
      - run: python3 tools/verify_export_evidence.py --scenario final
